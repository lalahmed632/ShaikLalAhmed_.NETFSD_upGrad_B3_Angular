    <title>Dynamic List</title>

<body>

<h1>Generating Dynamic List</h1>
<hr/>

<input type="button" value="Load Cities" onClick="loadCities()" />

<hr/>

<ul id="list1"></ul>

<script>

function loadCities()
{
    let listObj = document.getElementById("list1");
    
        listObj.innerHTML = "";

    for(let city of citiesArray)
    {
        let li = document.createElement("li");
        li.textContent = city;     
        list.appendChild(li);     
    }
}

</script>

</body>
</html>
