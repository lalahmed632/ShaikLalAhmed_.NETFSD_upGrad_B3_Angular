<div class="container">
  <h2>Add Contact</h2>
  <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="form">
    <div class="form-group">
      <label>Name *</label>
      <input formControlName="name" type="text" placeholder="Full name" />
      <span class="error" *ngIf="f['name'].touched && f['name'].errors?.['required']">Name is required.</span>
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input formControlName="email" type="email" placeholder="Email address" />
      <span class="error" *ngIf="f['email'].touched && f['email'].errors?.['required']">Email is required.</span>
      <span class="error" *ngIf="f['email'].touched && f['email'].errors?.['email']">Enter a valid email.</span>
    </div>
    <div class="form-group">
      <label>Phone *</label>
      <input formControlName="phone" type="text" placeholder="10-digit phone number" />
      <span class="error" *ngIf="f['phone'].touched && f['phone'].errors?.['required']">Phone is required.</span>
      <span class="error" *ngIf="f['phone'].touched && f['phone'].errors?.['minlength']">Minimum 10 digits required.</span>
    </div>
    <div class="btn-row">
      <button type="submit" [disabled]="contactForm.invalid || loading" class="btn-submit">
        {{ loading ? 'Saving...' : 'Add Contact' }}
      </button>
      <a routerLink="/contacts" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
